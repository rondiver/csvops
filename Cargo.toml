[package]
name = "csvops"
version = "0.1.0"
edition = "2021"
description = "CSV profiling and drift detection CLI tool"
authors = ["CSV Ops Team"]

[[bin]]
name = "csvops"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
regex = "1"
colored = "2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
