[package]
name = "csvops"
version = "0.1.1"
edition = "2021"
rust-version = "1.94"
description = "Inspect CSV data quality and compare changes across time periods, locally"
authors = ["Ron Diver"]
license = "MIT"
repository = "https://github.com/rondiver/csvops"
readme = "README.md"
keywords = ["csv", "cli", "data-quality", "profiling", "drift"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "examples/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "csvops"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
regex = "1"
colored = "2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
