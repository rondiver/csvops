name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94.1 fmt --all -- --check
      - name: Check lint
        run: cargo +1.94.1 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.94.1 test --locked
      - name: Verify source package
        run: cargo +1.94.1 package --locked
